kind = "web"
previewPath = "/pwa/"
title = "Share Brasil PWA"
version = "1.0.0"
id = "artifacts/share-brasil-pwa"
router = "path"

[[services]]
name = "web"
paths = [ "/pwa/" ]
localPort = 21244

[services.development]
run = "pnpm --filter @workspace/share-brasil-pwa run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/share-brasil-pwa", "run", "build" ]
serve = "static"
publicDir = "artifacts/share-brasil-pwa/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21244"
BASE_PATH = "/pwa/"
